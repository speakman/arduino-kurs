<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 820" font-family="Inter, system-ui, sans-serif">
  <!-- ============================================================
       Spänningsdelare-schema för slide 41 (Spänningsdelaren)
       Horisontell layout: schema vänster, värdetabell höger.
       Dark theme, cyan signal, red ground.
       ============================================================ -->

  <defs>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <g id="sunRays">
      <circle cx="0" cy="0" r="16" fill="#ffd400"/>
      <g stroke="#ffd400" stroke-width="3.5" stroke-linecap="round">
        <line x1="0" y1="-28" x2="0" y2="-23"/>
        <line x1="0" y1="23" x2="0" y2="28"/>
        <line x1="-28" y1="0" x2="-23" y2="0"/>
        <line x1="23" y1="0" x2="28" y2="0"/>
        <line x1="-20" y1="-20" x2="-16" y2="-16"/>
        <line x1="16" y1="16" x2="20" y2="20"/>
        <line x1="-20" y1="20" x2="-16" y2="16"/>
        <line x1="16" y1="-16" x2="20" y2="-20"/>
      </g>
    </g>
  </defs>

  <!-- ============================================================
       LEFT HALF: SCHEMA (x 0 - 440)
       Circuit centered at x=220
       ============================================================ -->

  <!-- +5V RAIL -->
  <text x="220" y="60" text-anchor="middle" font-size="38" font-weight="700" fill="#00ffd1" filter="url(#cyanGlow)">+5 V</text>
  <line x1="120" y1="90" x2="320" y2="90" stroke="#00ffd1" stroke-width="4"/>
  <line x1="220" y1="90" x2="220" y2="155" stroke="#0a0e14" stroke-width="3"/>

  <!-- PHOTORESISTOR -->
  <rect x="170" y="155" width="100" height="150" rx="6" fill="none" stroke="#0a0e14" stroke-width="3"/>
  <polyline points="180,175 200,185 180,195 200,205 180,215 200,225 180,235 200,245 180,255 200,265 180,275 200,285"
            fill="none" stroke="#0a0e14" stroke-width="3" stroke-linejoin="round"/>

  <!-- Sun + light arrows -->
  <g transform="translate(325 230)">
    <use href="#sunRays"/>
  </g>
  <g stroke="#ffd400" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="305" y1="218" x2="278" y2="218"/>
    <polyline points="285,212 278,218 285,224"/>
    <line x1="305" y1="242" x2="278" y2="242"/>
    <polyline points="285,236 278,242 285,248"/>
  </g>

  <!-- Photoresistor label -->
  <text x="115" y="225" text-anchor="end" font-size="28" font-weight="600" fill="#0a0e14">fotocell</text>
  <text x="115" y="253" text-anchor="end" font-size="20" fill="#4a5568">(LDR)</text>

  <!-- Wire down -->
  <line x1="220" y1="305" x2="220" y2="375" stroke="#0a0e14" stroke-width="3"/>

  <!-- A0 TAP -->
  <circle cx="220" cy="375" r="11" fill="#00ffd1" filter="url(#cyanGlow)"/>
  <line x1="220" y1="375" x2="370" y2="375" stroke="#00ffd1" stroke-width="4" filter="url(#cyanGlow)"/>
  <rect x="370" y="350" width="90" height="52" rx="13" fill="rgba(0,255,209,0.12)" stroke="#00ffd1" stroke-width="2.5"/>
  <text x="415" y="386" text-anchor="middle" font-size="30" font-weight="700" fill="#00ffd1" font-family="JetBrains Mono, monospace">A0</text>

  <!-- mätpunkt sublabel -->
  <text x="220" y="422" text-anchor="middle" font-size="19" font-style="italic" fill="#4a5568">mätpunkt</text>

  <!-- Wire down -->
  <line x1="220" y1="435" x2="220" y2="495" stroke="#0a0e14" stroke-width="3"/>

  <!-- 1 kΩ RESISTOR -->
  <rect x="170" y="495" width="100" height="140" rx="6" fill="none" stroke="#0a0e14" stroke-width="3"/>
  <polyline points="180,515 200,525 180,535 200,545 180,555 200,565 180,575 200,585 180,595 200,605 180,615"
            fill="none" stroke="#0a0e14" stroke-width="3" stroke-linejoin="round"/>

  <text x="300" y="555" font-size="28" font-weight="600" fill="#0a0e14" font-family="JetBrains Mono, monospace">1 kΩ</text>
  <text x="300" y="585" font-size="20" fill="#4a5568">(fast)</text>

  <!-- Wire down to GND -->
  <line x1="220" y1="635" x2="220" y2="700" stroke="#0a0e14" stroke-width="3"/>

  <!-- GND symbol -->
  <g stroke="#ff3366" stroke-width="5" stroke-linecap="round">
    <line x1="175" y1="700" x2="265" y2="700"/>
    <line x1="188" y1="720" x2="252" y2="720"/>
    <line x1="202" y1="740" x2="238" y2="740"/>
  </g>
  <text x="220" y="775" text-anchor="middle" font-size="26" font-weight="700" fill="#ff3366" font-family="JetBrains Mono, monospace">GND</text>

  <!-- ============================================================
       RIGHT HALF: VALUES TABLE (x 490 - 820)
       ============================================================ -->

  <!-- Vertical divider line -->
  <line x1="480" y1="80" x2="480" y2="740" stroke="#d4d6d0" stroke-width="2"/>

  <!-- Table heading -->
  <text x="650" y="130" text-anchor="middle" font-size="18" font-weight="700" fill="#4a5568" letter-spacing="3" font-family="JetBrains Mono, monospace">TYPISKA VÄRDEN</text>
  <text x="650" y="158" text-anchor="middle" font-size="15" fill="#8a95a3" letter-spacing="2" font-family="JetBrains Mono, monospace">1 kΩ MOT GND</text>

  <!-- Row 1 -->
  <g transform="translate(0, 240)">
    <circle cx="525" cy="0" r="18" fill="none" stroke="#00ffd1" stroke-width="2" opacity="0.5"/>
    <text x="525" y="6" text-anchor="middle" font-size="20">◗</text>
    <text x="570" y="7" font-size="22" font-weight="600" fill="#0a0e14">Hand över</text>
    <text x="710" y="7" font-size="26" font-weight="700" fill="#00ffd1" font-family="JetBrains Mono, monospace">20–100</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(0, 330)">
    <circle cx="525" cy="0" r="18" fill="none" stroke="#00ffd1" stroke-width="2" opacity="0.7"/>
    <text x="525" y="7" text-anchor="middle" font-size="20">◐</text>
    <text x="570" y="7" font-size="22" font-weight="600" fill="#0a0e14">Rumsljus</text>
    <text x="710" y="7" font-size="26" font-weight="700" fill="#00ffd1" font-family="JetBrains Mono, monospace">150–400</text>
  </g>

  <!-- Row 3 -->
  <g transform="translate(0, 420)">
    <circle cx="525" cy="0" r="18" fill="none" stroke="#00ffd1" stroke-width="2.5"/>
    <text x="525" y="7" text-anchor="middle" font-size="20">☀</text>
    <text x="570" y="7" font-size="22" font-weight="600" fill="#0a0e14">Lampa nära</text>
    <text x="710" y="7" font-size="26" font-weight="700" fill="#00ffd1" font-family="JetBrains Mono, monospace">500–700</text>
  </g>

  <!-- Bottom note -->
  <line x1="505" y1="540" x2="800" y2="540" stroke="#d4d6d0" stroke-width="1.5"/>
  <text x="650" y="585" text-anchor="middle" font-size="17" font-style="italic" fill="#4a5568">analogRead(A0) ger</text>
  <text x="650" y="620" text-anchor="middle" font-size="28" font-weight="700" fill="#00ffd1" font-family="JetBrains Mono, monospace">0 – 1023</text>
  <text x="650" y="655" text-anchor="middle" font-size="15" fill="#8a95a3">(10 bitar · ≈ 5 mV/steg)</text>

  <!-- Mörker → högt, ljus → lågt hint -->
  <text x="650" y="720" text-anchor="middle" font-size="16" fill="#4a5568"><tspan font-weight="700">mörkt</tspan> → lågt värde  ·  <tspan font-weight="700">ljust</tspan> → högt värde</text>
</svg>
